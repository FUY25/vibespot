<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeSpot Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f6;
        --label: #151917;
        --muted: #3a4a43;
        --green: #006b54;
        --surface: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--label);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      h1 {
        max-width: 820px;
        margin: 0 0 12px;
        font-size: clamp(44px, 7vw, 88px);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 720px;
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 20px;
        line-height: 1.4;
      }

      a {
        color: var(--green);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 32px 80px rgba(21, 25, 23, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Search becomes switching.</h1>
      <p>VibeSpot is a native macOS command palette for finding, previewing, switching, and starting Claude Code and Codex sessions.</p>
      <video src="readme-media/vibespot-demo.mp4" poster="readme-media/vibespot-demo-poster.jpg" controls playsinline preload="metadata"></video>
      <p><a href="readme-media/vibespot-demo.mp4">Open the MP4 directly</a></p>
    </main>
  </body>
</html>
